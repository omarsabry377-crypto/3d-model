<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leather Bucket Bag – 3D Model</title>
<style>
:root{--bg1:#eceae7;--bg2:#cfcdca;--chip:rgba(255,255,255,.75);--ink:#2a2a2c;--mute:#6b6b70;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2c2f;--bg2:#161719;--chip:rgba(40,41,44,.8);--ink:#ecebe8;--mute:#a3a3a8}}
:root[data-theme="dark"]{--bg1:#2b2c2f;--bg2:#161719;--chip:rgba(40,41,44,.8);--ink:#ecebe8;--mute:#a3a3a8}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2));color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid rgba(128,128,128,.3);border-radius:999px;padding:9px 18px;cursor:pointer;backdrop-filter:blur(6px)}
button:focus-visible{outline:2px solid #b07a4a;outline-offset:2px}
.hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;text-align:center;font-size:13px;color:var(--mute);pointer-events:none;padding:0 12px}
</style>
</head>
<body>
<div class="hint">Drag to rotate · scroll or pinch to zoom · right-drag to pan</div>
<div class="bar">
  <button id="spin" aria-pressed="false">Auto-rotate</button>
  <button id="reset">Reset view</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const V3 = THREE.Vector3;
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const HOME = new V3(4.6, 3.9, 5.6), TARGET = new V3(0, 1.25, 0);
camera.position.copy(HOME);

// Soft studio environment (softboxes on a gradient) for leather and brass reflections
(function(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(.5,'#cfcac4'); grd.addColorStop(1,'#6f6a64');
  g.fillStyle = grd; g.fillRect(0,0,512,256);
  g.fillStyle = '#fff';
  g.fillRect(60,40,110,60); g.fillRect(330,50,120,50); g.fillRect(200,10,100,26);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(t).texture;
})();

scene.add(new THREE.HemisphereLight(0xffffff, 0xb8aea2, 0.25));
const key = new THREE.DirectionalLight(0xfff4e6, 0.85);
key.position.set(4, 7, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, {left:-4, right:4, top:4, bottom:-4, near:1, far:20});
scene.add(key);
const fill = new THREE.DirectionalLight(0xe6eeff, 0.35); fill.position.set(-5, 3, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.45); rim.position.set(-2, 4, -6); scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({opacity: 0.28}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// Materials
function grain(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0,0,256,256);
  for (let i = 0; i < 2200; i++){
    const x = Math.random()*256, y = Math.random()*256, r = 1.5 + Math.random()*2.5, v = 100 + Math.random()*60|0;
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgb(${v},${v},${v})`); gr.addColorStop(1,'rgba(128,128,128,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(16, 7); return t;
}
const leather = new THREE.MeshStandardMaterial({color:0xc2a283, roughness:0.62, metalness:0, bumpMap:grain(), bumpScale:0.45, envMapIntensity:0.3, side:THREE.DoubleSide});
const leatherEdge = new THREE.MeshStandardMaterial({color:0xb39275, roughness:0.7, envMapIntensity:0.3});
const satin = new THREE.MeshStandardMaterial({color:0xd4c3a4, roughness:0.7, metalness:0, envMapIntensity:0.35, side:THREE.DoubleSide});
const cord = new THREE.MeshStandardMaterial({color:0xd8c394, roughness:0.85, envMapIntensity:0.3});
const brass = new THREE.MeshStandardMaterial({color:0xd6ad62, roughness:0.28, metalness:1});

[leather, leatherEdge, satin, cord, brass].forEach(m => m.color.convertSRGBToLinear());
const bag = new THREE.Group(); scene.add(bag);
function add(geo, mat){ const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; bag.add(m); return m; }

// Body: tapered bucket, open top, with wall thickness and a rounded base
const H = 1.5;
const R = y => 0.99 - 0.14*(y/H);
const prof = [[0,0],[0.84,0],[0.94,0.035],[R(0.12),0.12]];
for (let y = 0.3; y <= H; y += 0.3) prof.push([R(y), y]);
prof.push([R(H)-0.02, H+0.012], [R(H)-0.045, H]);
for (let y = 1.2; y >= 0.15; y -= 0.3) prof.push([R(y)-0.045, y]);
prof.push([0.9, 0.05], [0, 0.04]);
add(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 96), leather);
const roll = add(new THREE.TorusGeometry(R(H)-0.022, 0.026, 12, 96), leatherEdge);
roll.rotation.x = Math.PI/2; roll.position.y = H;

// Embossed brand mark (gold, wrapped on the body)
(function(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d'); g.clearRect(0,0,512,96);
  g.fillStyle = '#e6c27a'; g.font = '600 46px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (g.letterSpacing !== undefined) g.letterSpacing = '8px';
  g.fillText('DRAEGER', 256, 42);
  g.font = '14px Georgia, serif'; g.fillText('PARIS', 256, 82);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  const len = 0.62, y0 = 0.5, h = 0.115;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(R(y0+h/2)+0.004, R(y0-h/2)+0.004, h, 32, 1, true, -len/2, len),
    new THREE.MeshStandardMaterial({map:t, transparent:true, roughness:0.35, metalness:0.6, depthWrite:false}));
  m.position.y = y0; bag.add(m);
})();

// Satin lining, gathered above the rim with soft folds
(function(){
  const geo = new THREE.CylinderGeometry(0.7, 0.78, 1.87, 120, 40, true);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), yy = p.getY(i);
    const t = (yy + 0.935)/1.87, th = Math.atan2(x, z);
    const s = Math.min(Math.max((t - 0.7)/0.3, 0), 1), sm = s*s*(3 - 2*s);
    let r = 0.78 - 0.08*Math.min(t/0.75, 1) - 0.34*sm;
    r *= 1 + 0.07*t*t*Math.sin(9*th + 3*t) + 0.03*t*Math.sin(17*th) + 0.02*Math.sin(5*th + 6*t);
    p.setXYZ(i, Math.sin(th)*r, 0.08 + t*1.87 + 0.035*t*Math.sin(11*th), Math.cos(th)*r);
  }
  geo.computeVertexNormals(); add(geo, satin);
})();

// Handle: flat leather strap hugging the body, arching overhead
function ribbon(curve, n, w, th){
  const pos = [], idx = [];
  for (let i = 0; i <= n; i++){
    const t = i/n, pt = curve.getPoint(t), tan = curve.getTangent(t);
    const nr = new V3(0,0,1).cross(tan).normalize();
    [[1,1],[-1,1],[-1,-1],[1,-1]].forEach(([a,b]) =>
      pos.push(pt.x + nr.x*a*th/2, pt.y + nr.y*a*th/2, pt.z + b*w/2));
  }
  for (let i = 0; i < n; i++) for (let k = 0; k < 4; k++){
    const a = i*4 + k, b = i*4 + (k+1)%4, c = (i+1)*4 + k, d = (i+1)*4 + (k+1)%4;
    idx.push(a, c, b, b, c, d);
  }
  idx.push(0,1,2, 0,2,3); const e = n*4; idx.push(e,e+2,e+1, e,e+3,e+2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const hx = y => R(y) + 0.027;
const sides = [1, -1];
const leftPts = [0.78, 1.1, 1.5, 1.85, 2.2, 2.45].map(y => new V3(-(y <= 1.5 ? hx(y) : hx(1.5) + (y - 1.5)*0.12), y, 0));
const apex = new V3(0, 2.62, 0);
const rightPts = leftPts.slice().reverse().map(v => new V3(-v.x, v.y, 0));
const handleCurve = new THREE.CatmullRomCurve3([...leftPts, apex, ...rightPts], false, 'catmullrom', 0.5);
add(ribbon(handleCurve, 160, 0.17, 0.05), leather);
// Brass studs on the strap
sides.forEach(s => [0.82, 1.28].forEach(y => {
  const st = add(new THREE.CylinderGeometry(0.045, 0.045, 0.03, 24), brass);
  st.rotation.z = Math.PI/2; st.position.set(s*(hx(y) + 0.025 + 0.012), y, 0);
}));

// Drawstring: ring around the gathered lining, knot, and hanging tails with leather tips
const ring = add(new THREE.TorusGeometry(0.56, 0.02, 10, 96), cord);
ring.rotation.x = Math.PI/2; ring.scale.set(1, 1, 1); ring.position.y = 1.64;
const knot = add(new THREE.SphereGeometry(0.055, 16, 12), cord); knot.position.set(0.1, 1.64, 0.56); knot.scale.set(1.2, 0.9, 0.9);
function surf(x, y, off){ return new V3(x, y, Math.sqrt(Math.max(R(y)*R(y) - x*x, 0.01)) + off); }
function tail(x, yEnd, wobble){
  const pts = [new V3(0.1, 1.64, 0.56), new V3(x*0.9, 1.62, 0.78), new V3(x, 1.53, R(1.5)+0.03)];
  for (let y = 1.3; y > yEnd; y -= 0.25) pts.push(surf(x + wobble*Math.sin(y*5), y, 0.028));
  pts.push(surf(x, yEnd, 0.028));
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 90, 0.017, 8), cord);
  const tip = add(new THREE.BoxGeometry(0.06, 0.15, 0.022), leather);
  const e = pts[pts.length-1]; tip.position.set(e.x, e.y - 0.06, e.z + 0.004);
}
tail(0.11, 0.28, 0.012); tail(0.27, 0.52, 0.015);
(function(){ // left cord wrapping round the side
  const a = Math.sin, c = Math.cos, pts = [new V3(0.1, 1.64, 0.56), new V3(-0.3, 1.66, 0.62)];
  [[-0.9,1.57],[-1.15,1.45],[-1.3,1.28],[-1.38,1.08],[-1.4,0.92]].forEach(([phi, y]) => {
    const r = R(y) + (y>1.5?0.03:0.028); pts.push(new V3(r*a(phi), y, r*c(phi)));
  });
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 90, 0.017, 8), cord);
  const e = pts[pts.length-1], tip = add(new THREE.BoxGeometry(0.022, 0.15, 0.06), leather);
  tip.position.set(e.x, e.y - 0.06, e.z); tip.rotation.y = -1.4;
})();

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.5; controls.maxDistance = 14; controls.maxPolarAngle = Math.PI*0.52;
controls.autoRotateSpeed = 1.6; controls.update();
const spin = document.getElementById('spin');
spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', controls.autoRotate); spin.textContent = controls.autoRotate ? 'Stop rotating' : 'Auto-rotate'; };
document.getElementById('reset').onclick = () => { camera.position.copy(HOME); controls.target.copy(TARGET); controls.update(); };
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
